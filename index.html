<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>СловоВместе — Лексикон для двоих</title>
  
  <!-- Apple Web App Metas (iOS / iPadOS) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="СловоВместе">
  <link rel="apple-touch-icon" href="./assets/icons/icon.svg">
  <link rel="icon" type="image/svg+xml" href="./assets/icons/icon.svg">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#007AFF">

  <!-- PeerJS для бесплатных реалтайм дуэлей WebRTC -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <!-- Canvas Confetti для празднования побед -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <!-- Верхняя панель iOS -->
    <header class="ios-header">
      <div class="header-title-wrap">
        <div class="app-logo-badge">📖</div>
        <div>
          <h1 class="header-title" id="page-title">Карточки</h1>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="streak-badge" id="streak-indicator" title="Дни практики подряд">
          🔥 <span id="streak-count">1</span>
        </div>
        <button class="card-sound-btn" id="btn-open-add" title="Добавить своё слово" style="width: 36px; height: 36px; font-size: 18px;">
          ＋
        </button>
        <button class="card-sound-btn" id="btn-open-settings" title="Настройки" style="width: 36px; height: 36px; font-size: 16px;">
          ⚙️
        </button>
      </div>
    </header>

    <!-- Основной контейнер экрана -->
    <main class="screen-container" id="screen-container">
      <!-- Контент рендерится динамически через app.js -->
    </main>

    <!-- Нижняя панель навигации (iOS Tab Bar) -->
    <nav class="ios-tab-bar">
      <button class="tab-btn active" data-tab="cards">
        <span class="tab-icon">🗂️</span>
        <span>Карточки</span>
      </button>
      <button class="tab-btn" data-tab="duel">
        <span class="tab-icon">⚔️</span>
        <span>Дуэль</span>
        <span class="tab-badge" id="duel-live-badge" style="display: none;">LIVE</span>
      </button>
      <button class="tab-btn" data-tab="train">
        <span class="tab-icon">🎯</span>
        <span>Тренажёр</span>
      </button>
      <button class="tab-btn" data-tab="dictionary">
        <span class="tab-icon">📚</span>
        <span>Словарь</span>
      </button>
      <button class="tab-btn" data-tab="stories">
        <span class="tab-icon">✨</span>
        <span>Истории</span>
      </button>
    </nav>

    <!-- Модальные окна -->
    <div id="modal-container"></div>
  </div>

  <script type="module" src="./app.js"></script>
  <script>
    // Регистрация Service Worker для PWA
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('./sw.js').catch(console.warn);
    }
  </script>
</body>
</html>
